# VTK 预编译 SDK 生产管线（原 Panta 任务 038，vtk-test 任务 041 迁入；workflow_dispatch 手动触发）。
#
# 受信 CI 语义：按 tools/sdk/ 冻结的构建描述生产制品，自检通过后上传
# 构建产物；`publish` 输入为 true 时由收口 job 把归档与 .sha256 发布到
# GitHub Release（tag = sdk-vtk-9.7.0-webgpu），单一 tag 语义——不存在则
# 创建，已存在则刷新说明并清空全部旧资产后重传（维护者 2026-09-21 决策：
# 重产即全量覆盖，改名/停产的旧文件不残留），发布说明含源码 pin 与许可证
# 出处（tools/sdk/releases/vtk-9.7.0.md）。开发者与普通 CI 经 031 的
# sdk-provision 消费发布归档，不在本地编译 VTK 源码。2026-10-24 起由
# vtk-test 自行生产并发布到本仓库 Release（任务 041），不再消费 panta 的同名 Release。
#
# runner 工具链：cmake/ninja 为 runner 镜像预装组件（生产管线的受信
# 环境，不是开发者基线）；VTK 制品不消费 Qt，Qt Quick 由应用侧另行供给。

name: SDK artifacts (VTK)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 发布到 GitHub Release（tag sdk-vtk-9.7.0-webgpu）
        type: boolean
        default: false

concurrency:
  group: sdk-vtk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  vtk:
    name: vtk 9.7.0 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            cmake_generator: Ninja
            sdk_triple: macos-arm64
          - os: ubuntu-latest
            cmake_generator: Ninja
            sdk_triple: linux-x86_64
          - os: windows-2022
            cmake_generator: Visual Studio 17 2022
            cmake_generator_platform: x64
            sdk_triple: windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_GENERATOR: ${{ matrix.cmake_generator }}
      CMAKE_GENERATOR_PLATFORM: ${{ matrix.cmake_generator_platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Set macOS SDK deployment target
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=13.0" >> "$GITHUB_ENV"

      - name: Install Linux window-system development packages
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwayland-dev wayland-protocols libxkbcommon-dev

      - name: Produce VTK SDK
        shell: bash
        run: |
          cmake -S tools/sdk -B sdk-build/superbuild \
            -DPANTA_SDK_ENABLE_OCCT=OFF \
            -DPANTA_SDK_ENABLE_NETGEN=OFF
          cmake --build sdk-build/superbuild --target vtk_sdk

      - name: Selfcheck artifact
        shell: bash
        run: |
          cmake -S tools/sdk/selfcheck -B sdk-build/selfcheck \
            -DPSDK_ROOT="$PWD/sdk-build/superbuild/out/vtk/9.7.0/${{ matrix.sdk_triple }}" \
            -DPSDK_PACKAGE=VTK \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DPSDK_REQUIRED_TARGETS="VTK::RenderingWebGPU VTK::RenderingUI VTK::RenderingAnnotation dawn::webgpu_dawn"

      - name: Package artifact
        shell: bash
        run: |
          cmake -DPKG_ROOT="$PWD/sdk-build/superbuild/out/vtk/9.7.0/${{ matrix.sdk_triple }}" \
            -DPKG_NAME=vtk -DPKG_VERSION=9.7.0 \
            -DPKG_TRIPLE=${{ matrix.sdk_triple }} \
            -DPKG_DIST="$PWD/sdk-build/dist" \
            -P tools/sdk/package.cmake

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: vtk-9.7.0-${{ matrix.sdk_triple }}
          path: sdk-build/dist/*
          if-no-files-found: error

  # 发布收口：等三平台制品齐备后在单一 job 执行。清空再上传不能放在矩阵
  # job 里并发执行——删除循环会撞上其他平台的上传窗口。
  publish:
    name: publish release assets (single tag)
    if: inputs.publish
    needs: [vtk]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v5
        with:
          pattern: vtk-*
          merge-multiple: true
          path: sdk-build/dist

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view sdk-vtk-9.7.0-webgpu --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit sdk-vtk-9.7.0-webgpu \
              --repo "$GITHUB_REPOSITORY" \
              --title "VTK 9.7.0 WebGPU 原生窗口 SDK" \
              --notes-file tools/sdk/releases/vtk-9.7.0.md
            gh release view sdk-vtk-9.7.0-webgpu --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[].name' | while IFS= read -r asset; do
                gh release delete-asset sdk-vtk-9.7.0-webgpu "$asset" \
                  --repo "$GITHUB_REPOSITORY" --yes
              done
          else
            gh release create sdk-vtk-9.7.0-webgpu \
              --repo "$GITHUB_REPOSITORY" \
              --title "VTK 9.7.0 WebGPU 原生窗口 SDK" \
              --notes-file tools/sdk/releases/vtk-9.7.0.md
          fi
          gh release upload sdk-vtk-9.7.0-webgpu sdk-build/dist/* --clobber \
            --repo "$GITHUB_REPOSITORY"
