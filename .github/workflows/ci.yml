# PR 与 main 推送只跑 Linux：完整行为回归 + 格式、Clippy 与 QML 静态检查。
# macOS 与 Windows 的完整行为回归移至 nightly.yml（定时 + 手动触发）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build and test (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/panta-toolchain
      - uses: ./.github/actions/linux-gl-prereqs
      - uses: ./.github/actions/panta-cache-restore
      # Cargo 编译 workspace 和 launcher 构建脚本；native 集成测试构建 CMake
      # 测试目标并执行 qmllint/CTest，不另跑重复的 check/build/test 阶段。
      - name: Build and test Rust, native and QML
        run: cargo test --locked --workspace
      # task 019：只跑小规模基准，验证流式写入/LOD/整读链路可运行；大规模在本机跑。
      - name: Small-scale mesh benchmark
        run: cargo run --locked -p panta-mesh --example scale_bench -- --triangles 300k --budget 50k
      - uses: ./.github/actions/panta-cache-save

  quality:
    name: format, Clippy and QML (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/panta-toolchain
        with:
          components: "rustfmt,clippy"
      - uses: ./.github/actions/linux-gl-prereqs
      - uses: ./.github/actions/panta-cache-restore
      - name: Check source formatting
        run: cargo format --check
      - name: Check Rust
        run: cargo lint clippy --check
      - name: Check QML
        run: cargo lint qmllint --check
