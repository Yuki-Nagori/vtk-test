# macOS 与 Windows 完整行为回归：每日定时运行，也可手动触发；PR 只跑 Linux（ci.yml）。
name: Nightly

on:
  schedule:
    # 每天 18:00 UTC（北京时间次日 02:00）。
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/panta-toolchain
      - uses: ./.github/actions/panta-cache-restore
      - name: Build and test Rust, native and QML
        run: cargo test --locked --workspace
      - uses: ./.github/actions/panta-cache-save
