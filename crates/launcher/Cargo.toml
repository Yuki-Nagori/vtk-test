[package]
name = "panta-launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["bridge-module"]
bridge-module = []

[lints]
workspace = true

# DEP_PANTA_FFI_INCLUDE 只沿普通依赖边注入构建脚本（cargo 1.95/1.98 实测，
# 纯 [build-dependencies] 不注入），因此 panta-ffi 必须留在本表。
[dependencies]
panta-ffi.workspace = true

# build.rs 需要在启动前看到 panta-ffi 的 staticlib；普通依赖边仍保留，
# 以便 Cargo 向 launcher build script 注入 DEP_PANTA_FFI_INCLUDE metadata。
[build-dependencies]
panta-ffi.workspace = true
panta-build.workspace = true
